services:
  php:
    build: docker/php
    volumes:
      - ./slim:/var/www/html
    ports:
      - 8080:80
    user: phper
    depends_on:
      - db
    
  db:
    build: docker/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: slim
      MYSQL_USER: phper
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/my.cnf

  node:
    image: node:26.13.0-alpine
    working_dir: /app
    user: node
    volumes:
      - ./slim:/app
    profiles: ["tools"]

volumes:
  mysql_data: